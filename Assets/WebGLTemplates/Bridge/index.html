<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>{{{ PRODUCT_NAME }}}</title>
        <link rel="preconnect" href="https://bridge.playgama.com">
        <link rel="preload" href="zombie-defence-menu-bg-1024x512.png" as="image">
        <link rel="preload" href="Build/{{{ CODE_FILENAME }}}" as="fetch" type="application/wasm" crossorigin>
        <link rel="preload" href="Build/{{{ DATA_FILENAME }}}" as="fetch" crossorigin>
        <link rel="preload" href="Build/{{{ FRAMEWORK_FILENAME }}}" as="script">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0px;
                margin: 0px;
                overflow: hidden;
                overscroll-behavior: none;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                touch-action: none;
                background: #000 url('zombie-defence-menu-bg-1024x512.png') center / cover no-repeat;
            }
            .fullscreen-canvas {
                background: #000 url('zombie-defence-menu-bg-1024x512.png') center / cover no-repeat;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0px;
                left: 0px;
            }
            #unity-loading {
                position: absolute;
                inset: 0;
                z-index: 10;
                background: #000 url('zombie-defence-menu-bg-1024x512.png') center / cover no-repeat;
                pointer-events: none;
            }
            #unity-loading-bar {
                position: absolute;
                left: 0;
                right: 0;
                top: 50%;
                height: 3px;
                transform: translateY(-50%);
            }
            #unity-loading-fill {
                width: 0%;
                height: 100%;
                background: #ff1a1a;
                box-shadow: 0 0 10px #ff1a1a, 0 0 2px #ff0000;
            }
        </style>
    </head>
    <body oncontextmenu="return false;">
        <canvas id="canvas" class="fullscreen-canvas"></canvas>
        <div id="unity-loading">
            <div id="unity-loading-bar">
                <div id="unity-loading-fill"></div>
            </div>
        </div>
        <script src="./playgama-bridge-unity.js"></script>
    </body>
</html>
